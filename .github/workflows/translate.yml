name: HyperTranslator

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: hypertranslator
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Sync latest repo state
        run: |
          git fetch origin
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure candidates directory exists
        run: mkdir -p candidates

      - name: Run HyperTranslator
        run: |
          python hypertrans_workers.py translate source/ENGLISH.TXT --output candidates/batch5.json \
            --batch 5 \
            --resume \
            --workers 3 \
            --timeout 350

      - name: Commit updated candidates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add candidates/

          git diff --cached --quiet || git commit -m "Update translation candidates"

          git push
