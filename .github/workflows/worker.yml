name: Run Translation Worker

# This allows you to trigger the script manually from the GitHub Actions tab
on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  translate:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase deep-translator tqdm
          
      - name: 🚀 Run Worker
        env:
          # This securely pulls your database keys from GitHub Secrets
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Optional: Adjust how many threads run at once (defaults to 3 in your script)
          MAX_WORKERS: "3" 
        run: |
          python translation_worker.py worker
